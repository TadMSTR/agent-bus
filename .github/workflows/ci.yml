name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The suite existed since PR #5 and had never once executed here: the job body
      # was an import smoke test, and requirements.txt does not install pytest.
      - name: Tests
        run: pytest --cov=. --cov-report=term-missing

  build:
    name: Build and install the artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      # build-backend was an invalid string from May until 2026-08-19 and nothing
      # caught it, because CI only ever installed requirements.txt. This step is that
      # gap closed: it fails if the package cannot be built and imported.
      - name: Install the built wheel and import every module
        run: |
          pip install dist/*.whl
          python -c "import server, reconcile, agent_bus_client, event_log, event_vocab, nats_publisher"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the declared runtime dependencies. Auditing the installed environment
      # would fail on agent-bus itself, which is not published to PyPI.
      - name: Audit dependencies
        run: pip-audit --strict -r requirements.txt
