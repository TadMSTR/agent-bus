name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 05:47 UTC, so the `latest` job and the audit meet a new upstream
    # release or advisory without waiting for a PR.
    - cron: "47 5 * * 1"

# Least privilege at the top level. No job below escalates.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to commit SHAs (not floating tags) per repo-standards —
      # a moved tag can't silently swap the action's code out from under CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read.
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Without this the SHA-pinned action fetches the latest uv. Move it by hand,
          # in every job, alongside a `uv lock` refresh.
          version: "0.13.4"
      # FROM THE LOCK. `--frozen` installs exactly uv.lock and fails rather than
      # re-resolve, so a green run is evidence about the set that is deployed.
      # dev AND server: conftest.py imports `server` at module scope, so the whole
      # suite needs the server extra. `--extra dev` alone collects nothing.
      - name: Install dependencies (locked, [dev,server])
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --frozen --extra dev --extra server
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync pytest --cov=. --cov-report=term-missing

  # The newest versions pyproject.toml allows, not the lock. The lock is what
  # ships, so every other job tests it; this one exists because a pin alone hides a
  # forward-compatibility break until the day someone re-resolves (#611).
  #
  # GATING, deliberately. fastmcp and mcp are capped below their next major, so
  # anything that breaks here is a release a fresh install could pick up today. A
  # continue-on-error job would show a green tick over a red run.
  latest:
    name: Test against latest allowed versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
      - name: Resolve and install the newest allowed set
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          uv lock --upgrade
          uv sync --frozen --extra dev --extra server
      # Read from the project venv: a bare `uv pip list` follows UV_PYTHON to the
      # setup-python interpreter, which has none of these installed.
      - name: Versions under test
        run: >-
          uv run --frozen --no-sync python -c "import importlib.metadata as m;
          [print(p, m.version(p)) for p in
          ('fastmcp', 'mcp', 'cryptography', 'nats-py', 'opentelemetry-api')]"
      - run: uv run --frozen --no-sync pytest

  # DEPENDENCY AUDIT, against the lock. Auditing requirements.txt (as this job did up
  # to v0.5.0) re-resolved the declared ranges and reported on what a fresh install
  # would get that day, not on what is pinned and deployed.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
      # A committed lock nobody checks is a stale file that looks like a pin.
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check
      # Two sets: a runtime advisory affects the deployed server, a dev advisory only
      # CI. The runtime set is exactly the [server] extra, which is all the deployed
      # venv carries (README "Installation").
      # --no-emit-project: --strict trips on the project's own versionless entry.
      - name: Export runtime and dev dependency sets
        run: |
          mkdir -p .audit-runtime .audit-dev
          uv export --frozen --no-emit-project --extra server \
            --format pylock.toml -o .audit-runtime/pylock.toml
          uv export --frozen --no-emit-project --extra dev \
            --format pylock.toml -o .audit-dev/pylock.toml
      # Separate directories, so `--locked` cannot merge the two. pip-audit is pinned.
      # No --ignore-vuln without a dated, ticket-referenced reason next to it.
      - name: Audit runtime dependencies
        run: uv tool run --from "pip-audit==2.10.1" pip-audit --strict --locked .audit-runtime
      - name: Audit dev dependencies
        run: uv tool run --from "pip-audit==2.10.1" pip-audit --strict --locked .audit-dev

  build:
    name: Build and install the artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"

      # build-backend was an invalid string from May until 2026-08-19 and nothing
      # caught it, because CI only ever installed requirements.txt. This step is that
      # gap closed: it fails if the package cannot be built and imported.
      - name: Build wheel
        run: uv build --wheel

      # SPLIT IN TWO SINCE v0.3.1, and the bare-wheel half is load-bearing. It installs
      # the artifact with NO extras and imports only the client path, so it fails if a
      # server dependency ever creeps back into [project] dependencies — or if the
      # client starts needing one. tests/test_client_is_dependency_free.py checks the
      # import graph; this checks the packaging metadata. Neither catches the other's
      # failure: that test passes with fastmcp wrongly declared as a hard dep, and this
      # step passes if a new import lands on something installed for another reason.
      - name: Install the bare wheel — the client path must need no extras
        run: |
          cd /tmp
          uv venv -q bare
          uv pip install -q -p bare "$GITHUB_WORKSPACE"/dist/*.whl
          bare/bin/python -c "import agent_bus_client, event_log, event_vocab, outbox"
          bare/bin/python -c "import importlib.util as u, sys; p=[m for m in ('fastmcp','cryptography','nats') if u.find_spec(m)]; sys.exit('bare wheel pulled in server deps: '+repr(p)) if p else None"

      # The server's dependencies from the lock, then the wheel with --no-deps: the
      # same dependency set the deploy builds, so a module that imports something the
      # [server] extra does not carry fails here.
      - name: Install the locked server extra and import every module
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/server uv sync --frozen --no-install-project --extra server
          uv pip install -q -p /tmp/server --no-deps dist/*.whl
          cd /tmp
          server/bin/python -c "import server, reconcile, agent_bus_client, event_log, event_vocab, nats_publisher, outbox"
