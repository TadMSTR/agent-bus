name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds contents: write; leave no token in .git/config.
          persist-credentials: false

      - name: Create release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
        with:
          generate_release_notes: false
          body: |
            See [CHANGELOG.md](https://github.com/TadMSTR/agent-bus/blob/main/CHANGELOG.md) for what's in this release.
