[project]
name = "agent-bus"
version = "0.2.0"
description = "Inter-agent event bus with hash-chained JSONL logs and NATS federation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.4,<4",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
